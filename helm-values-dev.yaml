projectName: sparrowx
environment: dev

serviceName: task-api

replicaCount: 1

appPort: 8000
# extraAnnotations:
# extraLabels:

resources:
  size: medium


database:
  enabled: true
  name: taskdb
  engine: postgres
  port: 5432
  host: taskdb-postgres.dev.sparrowx.internal


servicemonitor:
  enabled: true

probePath: /health
livenessProbe:
  enabled: true
readinessProbe:
  enabled: true
startupProbe:
  enabled: true